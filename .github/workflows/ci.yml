name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms_password
          POSTGRES_DB: sms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sms -d sms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://sms:sms_password@localhost:5432/sms_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-please-change-this-32chars-min-0
      JWT_REFRESH_SECRET: ci-refresh-secret-please-change-this-32chars-min0
      QUEUE_DRIVER: inline
      EMAIL_DRIVER: console
      SMS_DRIVER: console
      STORAGE_DRIVER: local
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sms-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations (test DB)
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (with coverage)
        run: npm run test:coverage
