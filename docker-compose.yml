services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sms_password}
      POSTGRES_DB: sms_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sms -d sms_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://sms:${POSTGRES_PASSWORD:-sms_password}@db:5432/sms_dev?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a strong JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set a strong JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-Fenix <no-reply@fenix.local>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMS_DRIVER: ${SMS_DRIVER:-console}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      QUEUE_DRIVER: bullmq
    ports:
      - '4000:4000'
    volumes:
      - storage:/app/storage-local
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:4000/health/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://sms:${POSTGRES_PASSWORD:-sms_password}@db:5432/sms_dev?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a strong JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set a strong JWT_REFRESH_SECRET}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-Fenix <no-reply@fenix.local>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMS_DRIVER: ${SMS_DRIVER:-console}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      QUEUE_DRIVER: bullmq

volumes:
  pgdata:
  storage:
